<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Coverage-guided fuzzing loop</title>
  <desc id="desc">Inputs are selected from a corpus, mutated, and passed through a harness to the target. Observations serve two purposes: retaining useful coverage and saving inputs that trigger a failure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="610" rx="20" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
    <text x="40" y="51" font-size="28" font-weight="bold">Coverage-guided fuzzing</text>
    <text x="40" y="85" font-size="18" fill="#475569">Feedback guides the search. An oracle checks for failures.</text>
    <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 224 197 H 277"/>
      <path d="M 469 197 H 522"/>
      <path d="M 714 197 H 767"/>
      <path d="M 867 249 V 294 H 440 V 342"/>
      <path d="M 867 294 H 815 V 342"/>
      <path d="M 440 446 V 500 H 132 V 257"/>
      <path d="M 815 446 V 483"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="1.5">
      <rect x="40" y="145" width="184" height="104" rx="12" fill="#e0f2fe"/>
      <rect x="285" y="145" width="184" height="104" rx="12" fill="#ffffff"/>
      <rect x="530" y="145" width="184" height="104" rx="12" fill="#ffffff"/>
      <rect x="775" y="145" width="184" height="104" rx="12" fill="#ffffff"/>
      <rect x="290" y="350" width="300" height="96" rx="12" fill="#e0f2fe"/>
      <rect x="665" y="350" width="300" height="96" rx="12" fill="#fff7ed"/>
      <rect x="665" y="491" width="300" height="76" rx="12" fill="#ffffff"/>
    </g>
    <g text-anchor="middle">
      <text x="132" y="185" font-size="23" font-weight="bold">Corpus</text>
      <text x="132" y="218" font-size="16">Select an input</text>
      <text x="377" y="185" font-size="23" font-weight="bold">Mutator</text>
      <text x="377" y="218" font-size="16">Create a variation</text>
      <text x="622" y="184" font-size="21" font-weight="bold">Harness</text>
      <text x="622" y="218" font-size="20">+ target</text>
      <text x="867" y="185" font-size="23" font-weight="bold">Observe</text>
      <text x="867" y="218" font-size="16">Execution results</text>
      <text x="440" y="387" font-size="23" font-weight="bold">New coverage?</text>
      <text x="440" y="421" font-size="17">Keep useful inputs</text>
      <text x="815" y="387" font-size="23" font-weight="bold">Failure detected?</text>
      <text x="815" y="419" font-size="15">Sanitizer / assertion / time limit</text>
      <text x="815" y="522" font-size="21" font-weight="bold">Save input + report</text>
      <text x="815" y="549" font-size="16">Evidence for investigation</text>
    </g>
    <text x="170" y="486" font-size="16" fill="#0369a1">Add to the corpus</text>
    <text x="40" y="570" font-size="16" fill="#475569">A new path and a failure are separate observations.</text>
  </g>
</svg>
